# Build the portfolio image and roll Cloud Run.
# Manual only, matching the In-shorts deploy workflow.
# Secret required on this repo: GCP_SA_KEY (github-deployer JSON).

name: Deploy debapras-website to GCP

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GCP project id
        required: true
        default: rootlink-507715
      region:
        description: Region for Artifact Registry and Cloud Run
        required: true
        default: asia-south1

concurrency:
  group: gcp-debapras-website
  cancel-in-progress: false

permissions:
  contents: read

env:
  SERVICE_NAME: debapras-website
  AR_REPO: debapras-website

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
    steps:
      - name: Require GCP service account
        env:
          GCP_SA_PRESENT: ${{ secrets.GCP_SA_KEY != '' }}
        run: |
          test "${GCP_SA_PRESENT}" = "true" || { echo "Missing secret GCP_SA_KEY"; exit 1; }

      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ inputs.project_id }}

      - name: Set gcloud project
        run: |
          gcloud config set project "${PROJECT_ID}"
          gcloud config set run/region "${REGION}"

      - name: Enable APIs and Artifact Registry
        run: |
          set -euo pipefail
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            storage.googleapis.com
          gcloud artifacts repositories describe "${AR_REPO}" --location="${REGION}" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "${AR_REPO}" \
              --repository-format=docker \
              --location="${REGION}" \
              --description="debapras-website images"

      - name: IAM for Cloud Build upload
        run: |
          set -euo pipefail
          DEPLOYER="serviceAccount:github-deployer@${PROJECT_ID}.iam.gserviceaccount.com"
          gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
            --member="${DEPLOYER}" \
            --role="roles/storage.admin" \
            --condition=None \
            --quiet || echo "IAM bind skipped (needs Project IAM Admin on the deployer SA)"
          gcloud projects add-iam-policy-binding "${PROJECT_ID}" \
            --member="${DEPLOYER}" \
            --role="roles/serviceusage.serviceUsageConsumer" \
            --condition=None \
            --quiet || echo "IAM bind skipped (needs Project IAM Admin on the deployer SA)"
          PROJECT_NUM="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          gcloud artifacts repositories add-iam-policy-binding "${AR_REPO}" \
            --location="${REGION}" \
            --member="serviceAccount:${PROJECT_NUM}@cloudbuild.gserviceaccount.com" \
            --role="roles/artifactregistry.writer" \
            --quiet || echo "Artifact Registry writer bind skipped"

      - name: Build and push image
        env:
          PYTHONIOENCODING: "utf-8:replace"
          PYTHONUTF8: "1"
          LC_ALL: C.UTF-8
          CLOUDSDK_CORE_DISABLE_FILE_LOGGING: "true"
        run: |
          set -euo pipefail
          source deploy/github/ci-lib.sh
          cloud_build_submit_wait . deploy/github/cloudbuild.yaml "${GITHUB_SHA}"

      - name: Deploy Cloud Run
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA}"
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/web:${TAG}"
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --platform managed \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 60 \
            --min-instances 0 \
            --max-instances 2 \
            --allow-unauthenticated
          URL="$(gcloud run services describe "${SERVICE_NAME}" --region "${REGION}" --format='value(status.url)')"
          echo "URL=${URL}" >> "${GITHUB_ENV}"
          echo "URL=${URL}"

      - name: Smoke
        run: |
          set -euo pipefail
          echo "URL=${URL}"
          curl -fsS "${URL}/api/health"
          curl -fsS -o /dev/null -w "home=%{http_code}\n" "${URL}/"
